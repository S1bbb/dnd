services:
  dnd:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /srv/data/dnd.sqlite3
    volumes:
      - ./data:/srv/data
    ports:
      - "${WEB_PORT:-8080}:8080"

  # HTTPS по домену (необязательно): docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - dnd

volumes:
  caddy_data:
