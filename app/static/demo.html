<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Виджеты бота — превью</title>
<style>
  body { margin: 0; background: #0e1621; color: #fff; font: 15px system-ui, sans-serif; }
  .wrap { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 24px 16px; }
  .phone { width: 390px; max-width: 100%; background: #0e1621; border: 1px solid #253242; border-radius: 28px; padding: 14px 10px; }
  .top { text-align: center; padding: 6px 0 12px; border-bottom: 1px solid #1c2a3a; margin-bottom: 12px; }
  .top b { display: block; } .top span { font-size: 12px; color: #6d7f8f; }
  .msg { background: #182533; border-radius: 16px 16px 16px 4px; margin: 0 40px 12px 0; overflow: hidden; }
  .msg.me { background: #2b5278; margin: 0 0 12px 60px; border-radius: 16px 16px 4px 16px; padding: 8px 12px; }
  .txt { padding: 8px 12px; }
  iframe { width: 100%; border: 0; display: block; }
  h1 { text-align: center; font-weight: 600; margin: 24px 0 0; }
  p.sub { text-align: center; color: #6d7f8f; margin: 6px 16px 0; }
</style>
</head>
<body>
<h1>🎲 Виджеты бота (Bot API 10.4)</h1>
<p class="sub">Превью в браузере с имитацией Telegram. Броски здесь локальные, в настоящем боте их делает сервер.</p>
<div class="wrap">
  <div class="phone"><div class="top"><b>DnD Бот</b><span>бот</span></div>
    <div class="msg me">/sheet</div>
    <div class="msg"><iframe data-w="sheet"></iframe></div>
  </div>
  <div class="phone"><div class="top"><b>DnD Бот</b><span>бот</span></div>
    <div class="msg me">/dice</div>
    <div class="msg"><iframe data-w="dice"></iframe></div>
    <div class="msg"><iframe data-w="request"></iframe></div>
  </div>
</div>
<script>
const THEME = { bg_color: '#182533', text_color: '#f5f5f5', hint_color: '#708499', link_color: '#6ab3f3',
  button_color: '#5288c1', button_text_color: '#ffffff', secondary_bg_color: '#232e3c',
  accent_text_color: '#6ab2f2', destructive_text_color: '#ec3942', section_bg_color: '#17212b' };
const DATA = {
  sheet: { n: 'Тень', c: 'Плут', l: 4, hp: 9, mhp: 27, ac: 15, st: [10, 18, 12, 13, 10, 14], sv: [1, 3], sk: [0, 3, 8, 11, 15] },
  dice: { n: 'Тень' },
  request: { i: 1, t: 'Внимательность', h: 0 },
};
// Имитация window.TelegramWidget для превью
function mockSrc(name) {
  return `<script>
(function(){
const ST=${JSON.stringify(DATA.sheet)};
const md=n=>Math.floor((n-10)/2), pb=2+Math.floor((ST.l-1)/4);
const SKA=[1,3,0,4,4,5,5,3,1,3,4,5,3,4,3,1,5,4],AB=['str','dex','con','int','wis','cha'];
function roll(f,adv){f=f.replace(/\\s/g,'');const re=/([+-]?)(\\d*)d(\\d+)|([+-]?)(\\d+)/g;let m,r=[],s=[],b=0,t=0,c=0;
while(m=re.exec(f)){if(m[3]){const sg=m[1]=='-'?-1:1,n=+(m[2]||1),d=+m[3];let g=[];
let cnt=(adv&&d==20&&n==1)?2:n;for(let i=0;i<cnt;i++)g.push(1+Math.floor(Math.random()*d));
if(cnt!=n){const k=adv>0?Math.max(...g):Math.min(...g);let used=0;g=g.map(v=>(!used&&v==k)?(used=1,v):-v)}
t+=sg*g.filter(v=>v>0).reduce((a,v)=>a+v,0);r.push(g);s.push(d);if(d==20&&g.filter(v=>v>0).length==1){const k=g.find(v=>v>0);c=k==20?1:k==1?-1:0}}
else{b+=(m[4]=='-'?-1:1)*(+m[5]);}}t+=b;return{f:f+(adv>0?' (преим.)':adv<0?' (помеха)':''),t,r,s,b,c}}
let chat=${JSON.stringify(JSON.stringify(DATA[name]))};const ev={};
window.TelegramWidget={profile:1,isProfileAtLeast:n=>n<=1,colorScheme:'dark',themeParams:${JSON.stringify(THEME)},
isActive:true,isPreview:false,isForward:false,chatType:'private',viewer:{id:1,first_name:'Тень'},publicData:null,
get chatData(){return chat},ready(){},onEvent(t,f){(ev[t]=ev[t]||[]).push(f)},offEvent(){},
HapticFeedback:{impactOccurred(){},notificationOccurred(){},selectionChanged(){}},
request(q){return new Promise(ok=>setTimeout(()=>{let a,[k,v]=[q.slice(0,q.indexOf(':')),q.slice(q.indexOf(':')+1)];
if(k[0]=='r'&&k.length==3)a=roll(v,{n:0,a:1,d:-1}[k[1]]);
else if(k=='c')a=roll('1d20'+(md(ST.st[AB.indexOf(v)])>=0?'+':'')+md(ST.st[AB.indexOf(v)]));
else if(k=='s'){const i=AB.indexOf(v),x=md(ST.st[i])+(ST.sv.includes(i)?pb:0);a=roll('1d20'+(x>=0?'+':'')+x)}
else if(k=='k'){const x=md(ST.st[SKA[v]])+(ST.sk.includes(+v)?pb:0);a=roll('1d20'+(x>=0?'+':'')+x)}
else if(k=='i')a=roll('1d20+'+md(ST.st[1]));
else if(k=='q'){const x=md(ST.st[4])+pb;a=roll('1d20'+(x>=0?'+':'')+x);const d=JSON.parse(chat);d.x=a;chat=JSON.stringify(d);setTimeout(()=>(ev.chatDataChanged||[]).forEach(f=>f()),50)}
ok({result:JSON.stringify(a)})},450))}};
})();<\/script>`;
}
const css = ':root{' + Object.entries(THEME).map(([k, v]) => `--tg-theme-${k.replace(/_/g, '-')}:${v};`).join('') + '--tg-color-scheme:dark;color-scheme:dark}html{background:#182533}body{color:var(--tg-theme-text-color)}';
document.querySelectorAll('iframe').forEach(async (fr) => {
  const name = fr.dataset.w;
  const html = await (await fetch('/demo/widget/' + name)).text();
  fr.srcdoc = `<!doctype html><meta charset="utf-8"><style>${css}</style>${mockSrc(name)}${html}`;
  fr.onload = () => {
    const doc = fr.contentDocument;
    const fit = () => { fr.style.height = Math.min(600, doc.documentElement.scrollHeight) + 'px'; };
    fit(); new ResizeObserver(fit).observe(doc.body);
  };
});
</script>
</body>
</html>
