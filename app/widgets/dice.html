<style>
body{margin:0;padding:10px 12px max(10px,env(safe-area-inset-bottom)) 24px;font-family:system-ui,sans-serif}
.h{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.m{color:var(--tg-theme-hint-color);font-size:12px;font-weight:400}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
button{border:0;border-radius:10px;padding:9px 0;font:600 14px system-ui,sans-serif;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color)}
button:active{transform:scale(.95)}
.g button:last-child{grid-column:span 2}
.on{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
.p{display:flex;align-items:center;gap:6px;min-height:34px}
.f{flex:1;font:600 16px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{width:34px}
.r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0}
.go{width:100%;padding:12px 0;font-size:16px;background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
.o{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:56px}
.t{font:800 40px system-ui,sans-serif;min-width:64px;text-align:center}
.spin{animation:sp .5s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.c{color:#2fb35a}.x{color:var(--tg-theme-destructive-text-color)}
.d{font-size:13px;color:var(--tg-theme-hint-color);word-break:break-word}
.k{display:inline-block;padding:1px 6px;margin:2px 2px 0 0;border-radius:6px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);font:600 13px ui-monospace,monospace}
.k i{font-style:normal;text-decoration:line-through;color:var(--tg-theme-hint-color)}
.l{margin-top:8px;font-size:12px;color:var(--tg-theme-hint-color)}
</style>
<div class="h">🎲 Кости <span class="m" id="who"></span></div>
<div class="g" id="g"></div>
<div class="p"><div class="f" id="f">выбери кубики</div><button class="s" id="mm">−</button><button class="s" id="mp">+</button><button class="s" id="cl">✕</button></div>
<div class="r" id="md"></div>
<button class="go" id="go">Бросить</button>
<div class="o"><div class="t" id="t">–</div><div class="d" id="d"></div></div>
<div class="l" id="l"></div>
<script>
const W=window.TelegramWidget,$=i=>document.getElementById(i),S=[4,6,8,10,12,20,100],M=['Обычно','Преим.','Помеха'];
let pool={},mod=0,mode=0,busy=0,hist=[];
try{hist=JSON.parse(localStorage.getItem('h'))||[]}catch(e){}
const cd=()=>{try{return JSON.parse(W.chatData)||{}}catch(e){return{}}};
function fx(){let s=S.filter(n=>pool[n]).map(n=>pool[n]+'d'+n).join('+');if(mod)s+=(mod>0?'+':'')+mod;return s}
function draw(){
$('f').textContent=fx()||'выбери кубики';
$('g').replaceChildren(...S.map(n=>{const b=document.createElement('button');b.textContent=(pool[n]?pool[n]+'×':'')+'d'+n;if(pool[n])b.className='on';b.onclick=()=>{pool[n]=(pool[n]||0)+1;if(n!=20)mode=0;draw()};return b}));
$('md').replaceChildren(...M.map((m,i)=>{const b=document.createElement('button');b.textContent=m;if(mode==i)b.className='on';b.onclick=()=>{mode=i;if(i&&!pool[20])pool[20]=1;draw()};return b}));
$('l').textContent=hist.length?'Недавно: '+hist.join(' · '):'';
$('who').textContent=cd().n||''}
$('mm').onclick=()=>{mod--;draw()};$('mp').onclick=()=>{mod++;draw()};$('cl').onclick=()=>{pool={};mod=0;mode=0;draw()};
function show(a){
const t=$('t');t.className='t'+(a.c>0?' c':a.c<0?' x':'');t.textContent=a.t;
$('d').innerHTML=a.f+'<br>'+a.r.map((g,j)=>g.map(v=>'<span class="k">'+(v<0?'<i>'+-v+'</i>':v)+'</span>').join('')).join(' ')+(a.b?' <span class="k">'+(a.b>0?'+':'')+a.b+'</span>':'')+(a.c>0?' 💥 КРИТ!':a.c<0?' 💀 провал':'');
hist.unshift(a.t);hist=hist.slice(0,8);try{localStorage.setItem('h',JSON.stringify(hist))}catch(e){}
$('l').textContent='Недавно: '+hist.join(' · ');
W.HapticFeedback&&W.HapticFeedback.notificationOccurred(a.c<0?'error':'success')}
$('go').onclick=()=>{
const f=fx();if(!f||busy)return;if(!W){$('d').textContent='Открой в Telegram';return}
busy=1;$('t').className='t spin';$('t').textContent='🎲';$('d').textContent='';
W.request('r'+'nad'[mode]+'v'+':'+f).then(r=>{busy=0;let a;try{a=JSON.parse(r.result)}catch(e){}if(a&&a.e){$('t').className='t';$('t').textContent='?';$('d').textContent=a.e}else if(a)show(a)},e=>{busy=0;$('t').className='t';$('t').textContent='!';$('d').textContent=e.code=='NOT_ALLOWED'?'Бросать можно в чате с ботом':e.code=='RATE_LIMITED'?'Слишком быстро, подожди':'Не вышло: '+e.code})};
W&&W.onEvent('chatDataChanged',draw);
pool[20]=1;draw();W&&W.ready&&W.ready();
</script>
